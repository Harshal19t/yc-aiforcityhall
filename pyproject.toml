[project]
name = "pdcheck"
version = "0.1.0"
description = "Householder permitted development pre-check with an evaluation harness"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
geo = ["geopandas", "shapely"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
