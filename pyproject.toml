[project]
name = "pdcheck"
version = "0.1.0"
description = "Householder permitted development pre-check with an evaluation harness"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "fastapi>=0.111", "uvicorn[standard]>=0.29", "shapely>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
geo = ["geopandas", "shapely"]
scrape = ["beautifulsoup4>=4.12", "lxml>=5", "pdfplumber>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
